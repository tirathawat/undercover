name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "${package_version}" != "${lock_version}" || "${package_version}" != "${lock_root_version}" ]]; then
            echo "package.json and package-lock.json versions must match" >&2
            exit 1
          fi

          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Tag ${tag} does not match package version v${package_version}" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${tag}")" != 'tag' ]]; then
            echo "Release tag ${tag} must be annotated" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${tag} must point to a commit on main" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run linters
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build frontend
        run: npm run build
      - name: Build server
        run: npm run build:server

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag "undercover-ci:${GITHUB_SHA}" .
      - name: Smoke test image
        shell: bash
        run: |
          container="undercover-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "${container}" --publish 127.0.0.1:18080:8080 "undercover-ci:${GITHUB_SHA}"
          trap 'docker logs "${container}"; docker rm --force "${container}" >/dev/null' EXIT

          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:18080/healthz)"
          test "${health}" = '{"ok":true}'
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep --fixed-strings '<div id="root"></div>'

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - checks
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
